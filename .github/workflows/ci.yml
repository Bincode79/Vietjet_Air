name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# The app lives in the vietjetsim-main/ subdirectory, so every `run` step has to
# execute there. This file used to sit at vietjetsim-main/.github/workflows/, where
# GitHub does not discover it at all — GitHub only reads .github/workflows/ from
# the repository root — so this workflow had never run once. The bug it would
# have caught is real: 014 was not idempotent after 022 renamed the demo emails.
defaults:
  run:
    working-directory: vietjetsim-main

env:
  # Node 20 cannot run this suite: vitest@5 declares engines
  # "^22.12.0 || ^24.0.0 || >=26.0.0" and the app now pins @types/node ^26.
  # Keep this in step with SETUP.md ("Node.js v26.7.0 trở lên") — otherwise CI
  # fails before a single test runs.
  NODE_VERSION: '26'

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vietjetsim-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      # Ratchet nợ CSS: chặn `text-[Npx]`, `[#rrggbb]`, `p-[Npx]`,
      # `rounded-[Npx]` và `shadow-[…]` MỚI phát sinh. Baseline nằm ở
      # `scripts/css-debt-baseline.json` và chỉ được hạ, không được nâng.
      #
      # Vì sao phải chạy trong CI: đây là RATCHET, không phải luật — nó đỏ khi
      # con số TĂNG so với baseline. Chạy một lần rồi không chạy lại thì nó
      # không làm gì cả: người viết code mới thêm `p-[13px]` sẽ không bị chặn
      # cho tới lần chạy kế tiếp — tức là quá muộn.
      - name: Check CSS debt ratchet
        run: npm run lint:css-debt

      # Chặn class Tailwind không tồn tại (typo, hoặc class bị "dính" khi thay
      # thế hàng loạt). Class không sinh ra CSS thì im lặng — không ai thấy.
      - name: Check Tailwind classes exist
        run: npm run lint:tailwind-classes

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vietjetsim-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: vietjetsim-main/coverage/
          retention-days: 7

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Runs `npm run test:migrations`, which is the same four-pass replay this
      # used to spell out by hand — it applies the whole set against an empty
      # database, re-applies it three more times, and asserts the row count and
      # a full row fingerprint are stable, plus the "expected tables" checks
      # below. Keeping one command means CI and a local run cannot drift apart,
      # which is how the old copy-pasted loop fell behind the files.
      #
      # No `npm ci`: the script only shells out to docker/psql, so there is
      # nothing to install and this job stays fast.
      - name: Migration replay
        working-directory: vietjetsim-main
        run: node scripts/test-migrations.cjs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vietjetsim-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          CI: true

      # Chạy ngay sau build, trên chính artifact vừa sinh ra.
      #
      # Lỗi "pdfkit không tìm thấy font Helvetica.afm" chỉ xuất hiện trong bản
      # build (khi `pdfkit` bị bundle vào server chunk, `__dirname` trỏ sai chỗ)
      # — unit test chạy trên source vẫn xanh, nên không cổng nào khác bắt
      # được. Script này kiểm tra đúng thứ production chạy: `pdfkit` nằm ngoài
      # bundle, được trace vào standalone kèm file `.afm`, và sinh ra PDF thật
      # từ đúng thư mục standalone.
      - name: Verify PDF file-generation pipeline
        run: npm run test:pdf-pipeline

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vietjetsim-main/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `scripts/run-smoke.sh` dựng server, chờ nó sẵn sàng, chạy smoke test
      # rồi dọn dọn — tất cả trong một tiến trình, nên CI và local chạy đúng
      # một cách (trước đây CI copy-paste cấu hình riêng và có thể trôi khỏi
      # script).
      #
      # Script tự gán `DATABASE_URL=""` để app chạy trên bộ nhớ in-memory:
      # smoke test phải cho kết quả giống nhau mọi lần chạy, và CI không có
      # database nào để nối vào.
      - name: Smoke test against a running server
        run: bash scripts/run-smoke.sh
        env:
          JWT_SECRET: ci-smoke-test-secret
          JWT_REFRESH_SECRET: ci-smoke-test-refresh-secret

      - name: Upload server log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-server-log
          path: /tmp/vietjet-smoke-server.log
          retention-days: 7

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test, build, smoke, migrations]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint-and-type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | ${{ needs.smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | ${{ needs.migrations.result }} |" >> $GITHUB_STEP_SUMMARY
